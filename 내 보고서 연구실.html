<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>내 보고서 연구실</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700;800&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* Layout: lab bench — fixed step rail on top, chat (left) and meeting room (right) split below */
:root{
  --bg:#f3f4f1; --panel:#ffffff; --ink:#1f2a2e; --muted:#66727a; --line:#dde1dc;
  --accent:#24557a; --accent-ink:#ffffff; --lamp:#e2a33b; --lamp-soft:#fbefd6;
  --bubble-ai:#eef1ec; --room:#f7f8f5;
  --ea:#c4841f; --eb:#24557a; --ec:#b24a3c; --ed:#3d7a5a;
  --display:"Nanum Myeongjo", "Batang", serif;
  --body:"IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#161b1d; --panel:#1e2427; --ink:#e6ebe8; --muted:#97a3a8; --line:#2f383b;
  --accent:#6fa3cc; --accent-ink:#0f1a22; --lamp:#f0b54d; --lamp-soft:#3a2f1a;
  --bubble-ai:#262e31; --room:#1a2023; --ea:#e0a347; --eb:#6fa3cc; --ec:#de7b6c; --ed:#72b891; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#161b1d; --panel:#1e2427; --ink:#e6ebe8; --muted:#97a3a8; --line:#2f383b;
  --accent:#6fa3cc; --accent-ink:#0f1a22; --lamp:#f0b54d; --lamp-soft:#3a2f1a;
  --bubble-ai:#262e31; --room:#1a2023; --ea:#e0a347; --eb:#6fa3cc; --ec:#de7b6c; --ed:#72b891; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6}
.app{height:100%;display:flex;flex-direction:column;gap:14px;padding-block:16px;padding-inline:16px;box-sizing:border-box;max-width:1280px;margin:0 auto}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
h1{font-family:var(--display);font-weight:800;font-size:1.6rem;margin:0;letter-spacing:-.01em;text-wrap:balance}
.steps{display:flex;flex-wrap:wrap;gap:6px;list-style:none;margin:0;padding:0}
.title-row{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.dl{background:transparent;color:var(--accent);border:1px solid var(--accent);padding:6px 14px;font-size:.88rem}
.dl:hover:not(:disabled){background:var(--accent);color:var(--accent-ink)}
.warn{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px 14px;border-radius:8px;font-weight:600;font-size:.92rem;color:var(--ink);
  background:repeating-linear-gradient(-45deg,var(--lamp-soft) 0 14px,var(--panel) 14px 28px);border:1px solid var(--lamp)}
.warn::before{content:"!";flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--lamp);color:var(--panel);font-weight:800}
.rethink{align-self:flex-start;background:transparent;color:var(--accent);border:1px dashed var(--line);font-size:.82rem;font-weight:500;padding:6px 12px}
.rethink:hover:not(:disabled){border-color:var(--accent)}
.warn .rethink{margin-left:auto;align-self:center;background:var(--lamp);color:var(--panel);border:0;font-weight:700}
.task{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.task-label{font-size:.78rem;color:var(--muted);letter-spacing:.04em}
.step{display:flex;align-items:center;gap:8px;padding:6px 14px;border-radius:999px;border:1px solid var(--line);color:var(--muted);font-size:.9rem;font-weight:400;background:var(--panel)}
.step:hover:not(.on){border-color:var(--lamp);color:var(--ink)}
.brief .badge{background:var(--muted)}
.toc{min-width:0;display:flex;flex-direction:column;gap:10px;font-size:.93rem;margin-top:4px}
.toc h4{margin:0;font-size:.78rem;color:var(--muted);font-weight:500;letter-spacing:.02em}
.toc ol,.toc ul{margin:0;padding-left:1.3em}
.toc ul{color:var(--muted)}
.toc .ch{font-weight:600}
.step .dot{width:8px;height:8px;border-radius:50%;background:var(--line)}
.step.on{color:var(--ink);font-weight:600;border-color:var(--lamp);background:var(--lamp-soft)}
.step.on .dot{background:var(--lamp);box-shadow:0 0 0 3px color-mix(in srgb,var(--lamp) 30%,transparent),0 0 10px var(--lamp)}
.split{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:14px}
.pane{min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.pane-head{padding:12px 18px;border-bottom:1px solid var(--line);font-weight:600;font-size:.95rem;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.pane-head small{color:var(--muted);font-weight:400;font-size:.8rem}
.log{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:82%;padding:10px 14px;border-radius:14px;white-space:pre-wrap;word-break:break-word}
.msg.ai{align-self:flex-start;background:var(--bubble-ai);border-bottom-left-radius:4px}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}
.msg.wait{color:var(--muted);font-style:italic}
form{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
textarea{flex:1;min-width:0;resize:none;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;height:48px}
textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font:inherit;font-weight:600;border:0;border-radius:8px;padding:0 18px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
button:disabled{opacity:.5;cursor:default}
.room{flex:1;min-height:0;overflow-y:auto;background:var(--room);display:flex;flex-direction:column;padding:18px;
  background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:22px 22px}
.room > p{margin:auto;color:var(--muted);font-size:1rem;text-align:center;background:var(--room);padding:6px 12px;border-radius:6px}
#rounds{display:flex;flex-direction:column;gap:22px}
.round{display:flex;flex-direction:column;gap:10px}
.round-head{font-size:.8rem;color:var(--muted);letter-spacing:.02em;background:var(--room);align-self:flex-start;padding:2px 8px;border-radius:4px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.expert{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;grid-template-columns:32px 1fr;gap:4px 12px}
.badge{grid-row:span 2;position:relative;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:var(--panel);font-size:.95rem}
.badge svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.badge-letter{position:absolute;right:-5px;bottom:-5px;min-width:15px;text-align:center;font-size:.62rem;line-height:15px;border-radius:4px;background:var(--panel);color:var(--ink);border:1px solid var(--line)}
.who{font-weight:600;font-size:.92rem;min-width:0}
.who span{color:var(--muted);font-weight:400;font-size:.8rem;margin-left:6px}
.say{min-width:0;white-space:pre-wrap;word-break:break-word;font-size:.93rem}
.say.wait{color:var(--muted);font-style:italic}
.expert.a .badge{background:var(--ea)} .expert.b .badge{background:var(--eb)} .expert.c .badge{background:var(--ec)} .expert.d .badge{background:var(--ed)}
.expert.d{border-color:var(--ed)}
.sum{min-width:0;margin:4px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;font-size:.93rem}
.sum li{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:baseline}
.sum .n{font-weight:700;color:var(--ed);font-variant-numeric:tabular-nums}
.sum .lbl{display:block;font-size:.78rem;color:var(--muted);letter-spacing:.02em}
.sum .body{min-width:0;word-break:break-word}
.why{margin:2px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:2px}
.tag{display:inline-block;min-width:18px;text-align:center;font-size:.72rem;font-weight:700;color:var(--panel);border-radius:4px;padding:0 4px;margin-right:6px}
.tag.a{background:var(--ea)} .tag.b{background:var(--eb)} .tag.c{background:var(--ec)}
.cmd{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:2px}
.cmd code{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-family:var(--body);font-size:.88rem;word-break:break-word}
.small{font-size:.8rem;padding:4px 10px;height:auto;background:transparent;color:var(--accent);border:1px solid var(--line)}
.decide{grid-column:1 / -1;border-top:1px dashed var(--line);margin-top:10px;padding-top:10px;display:flex;flex-direction:column;gap:8px}
.choice{display:flex;gap:8px;flex-wrap:wrap}
.choice button{background:transparent;color:var(--ink);border:1px solid var(--line);padding:6px 16px}
.choice button[aria-pressed="true"].yes{background:var(--ed);border-color:var(--ed);color:var(--panel)}
.choice button[aria-pressed="true"].no{background:var(--ec);border-color:var(--ec);color:var(--panel)}
.reason{display:flex;gap:8px;flex-wrap:wrap}
.reason input{flex:1;min-width:0;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.reason input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.reason button{padding:8px 18px}
.hint{font-size:.78rem;color:var(--muted)}
.saved{font-size:.88rem}
.msg .related-intro{white-space:normal;color:var(--muted);font-size:.85rem}
.msg .related{margin:2px 0 8px;padding-left:1.2em;white-space:normal}
.msg .ask-q{white-space:normal;font-weight:600}
.opts{display:flex;flex-direction:column;gap:6px;margin-top:10px;white-space:normal}
.opt{background:var(--panel);color:var(--ink);border:1px solid var(--line);padding:8px 12px;text-align:left;font-weight:500}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.other{color:var(--muted)}
.saved b.yes{color:var(--ed)} .saved b.no{color:var(--ec)}
@media (max-width:760px){
  .app{height:auto;min-height:100%}
  .split{grid-template-columns:1fr}
  .pane.chat{height:70vh}
  .pane.meet{min-height:220px}
}
</style>

<div class="app">
  <header>
    <div class="title-row"><h1>내 보고서 연구실</h1><button type="button" id="dl" class="dl">기록 내려받기</button><span id="dlMsg" class="hint" aria-live="polite"></span></div>
    <div class="task"><span class="task-label">이번 작업</span>
    <ol class="steps" aria-label="이번 작업 단계">
      <li><button type="button" class="step on" data-stage="1" aria-pressed="true" title="세 명이 각도를 넓혀 줍니다"><span class="dot"></span>① 생각 넓히기</button></li>
      <li><button type="button" class="step" data-stage="2" aria-pressed="false" title="세 명이 범위를 줄이는 쪽으로만 말합니다"><span class="dot"></span>② 주제 좁히기</button></li>
      <li><button type="button" class="step" data-stage="3" aria-pressed="false" title="토론 없이 제목 후보 3개와 4장 목차를 바로 만듭니다"><span class="dot"></span>③ 제목과 목차</button></li>
    </ol>
  </header>

  <main class="split">
    <section class="pane chat" aria-label="AI와 대화">
      <div class="pane-head">AI와 대화하기 <small>Enter로 보내기 · Shift+Enter로 줄바꿈</small></div>
      <div class="log" id="log" aria-live="polite">
        <div class="msg ai">안녕하세요. 보고서 준비를 함께 시작해 보겠습니다.
요즘 관심 있는 것이나 궁금했던 것을 편하게 적어 주세요. 한 단어여도 괜찮습니다.</div>
      </div>
      <form id="form">
        <textarea id="input" placeholder="생각나는 것을 자유롭게 적어 주세요" aria-label="메시지 입력"></textarea>
        <button id="send" type="submit">보내기</button>
      </form>
    </section>

    <section class="pane meet" aria-label="회의실">
      <div class="pane-head">회의실</div>
      <div class="room" id="room"><p id="roomEmpty">왼쪽에 생각을 적어보세요</p><div id="rounds" hidden></div></div>
    </section>
  </main>
</div>

<script>
const log = document.getElementById('log');
const form = document.getElementById('form');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
let stage = 1;
const NO_DATA = ' "먼저 자료를 찾아보세요", "수치를 확인해 보세요" 같은 말로 끝내지 마세요. 자료 수집은 다음 주에 합니다.';
function system(mode){
  const base = '당신은 대학생의 보고서 주제 탐색을 돕는 친절한 조교입니다. 반드시 한국어 존댓말로, 짧고 따뜻하게(5문장 이내) 답하세요.' + NO_DATA;
  if (mode === 'exec') return '당신은 대학생의 보고서 작업을 돕는 조교입니다. 학생의 요청을 토론이나 되묻기 없이 바로 실행해 결과만 한국어 존댓말로 간결하게 주세요.' + NO_DATA;
  const shortRule = ' 학생이 짧은 단어나 주제명만 적었다면, 설명을 늘어놓지 말고 그 단어에서 이어지는 관련 질문 2~3개로 되물어 주세요.';
  if (mode === 2) return base + shortRule + ' 지금은 "② 주제 좁히기" 단계입니다. 새 각도를 늘리지 말고, 대상·기간·질문 중 무엇을 줄일지 범위를 좁히는 쪽으로만 도와주세요. 마지막에 학생이 고를 수 있는 좁히기 질문 하나를 던지세요.';
  return base + shortRule + ' 지금은 "① 생각 넓히기" 단계입니다. 학생의 관심사를 판단하지 말고, 연관된 관점·사례·질문을 2~3개 제시하며 생각을 넓히도록 도와주세요. 주제를 성급히 좁히지 마세요. 마지막에 학생에게 질문 하나를 던지세요.';
}
// "제목 만들어줘", "목차 짜줘" 같은 실행 요청
const isExec = t => /(만들어\s*(줘|주세요|줄래|봐)|짜\s*줘|짜\s*주세요|짜\s*줄|뽑아|정해\s*줘|정해\s*주세요|작성해|써\s*줘|써\s*주세요|잡아\s*줘|잡아\s*주세요|정리해\s*줘|정리해\s*주세요)/.test(t);
const wantsToc = t => /(제목|목차|구성|개요)/.test(t);
const turns = [];
let sample = null;
const ready = (window.claude && window.claude.use) ? window.claude.use('sample').then(s => { sample = s; }) : Promise.resolve();

function add(cls, text){
  const d = document.createElement('div');
  d.className = 'msg ' + cls; d.textContent = text;
  log.appendChild(d); log.scrollTop = log.scrollHeight; return d;
}

async function send(bubble, mode){
  await ready;
  if (!sample){
    bubble.className = 'msg ai';
    bubble.textContent = '지금은 AI와 연결되지 않았습니다. 이 화면을 Claude에서 열면 대화를 이어갈 수 있습니다.';
    return;
  }
  const convo = turns.map((t,i) => i === turns.length - 1 ? {role:'user', content: system(mode) + '\n\n학생: ' + t.content} : t);
  try{
    const r = await sample(convo, {cache:false, onText: ({text}) => { bubble.className='msg ai'; bubble.textContent = text; log.scrollTop = log.scrollHeight; }});
    bubble.className = 'msg ai'; bubble.textContent = r.text;
    turns.push({role:'assistant', content: r.text});
  }catch(e){
    bubble.className = 'msg ai';
    turns.pop();
    bubble.textContent = e && e.code === 'rate_limited'
      ? '요청이 잠시 많습니다. 조금 뒤에 다시 보내 주세요.'
      : (e && e.code === 'not_granted' ? 'AI 사용 권한이 허용되지 않았습니다. 권한을 허용하시면 대화할 수 있습니다.' : '답변을 받지 못했습니다. 다시 보내 주세요.');
  }
}

/* ---------- 회의실: 전문가 세 명 ---------- */
const roundsEl = document.getElementById('rounds');
const roomEl = document.getElementById('room');
const ideas = [];        // 학생이 지금까지 적은 생각
const history = [];      // 지난 회의의 발언 {a,b,c}
const COMMON = '\n\n[공통 규칙]\n- 한국어 존댓말(해요체)로, 학생에게 직접 말을 건네는 대화체로 씁니다. 보고서 문체(~이다, ~함)나 개조식은 쓰지 않습니다.\n- 5줄 이내로 씁니다. 한 줄은 한 문장입니다. 머리말이나 인사는 쓰지 않습니다.\n- "먼저 자료를 찾아보세요", "수치를 확인해 보세요" 같은 말로 끝내지 않습니다. 자료 수집은 다음 주에 하므로, 지금은 생각과 구조만 다룹니다.\n- 마크다운 기호(#, *, -)를 쓰지 말고 평문으로 씁니다.';
// 세 사람의 말투: 모두 정중한 해요체 대화체지만 성격이 다릅니다
const VOICE = {
  a: '\n\n[말투] 학생과 마주 앉아 신나서 이야기하는 선배처럼 말합니다. 밝고 호기심 많은 해요체로, "이거 재밌지 않아요?", "~거든요", "~해 보면 어때요?" 같은 말을 자연스럽게 섞습니다. 떠오른 생각을 들려주듯 말하고, 딱딱한 나열은 피합니다.',
  b: '\n\n[말투] 차분하고 꼼꼼한 조교처럼 말합니다. 정돈된 해요체로, "그럼 이렇게 나눠 볼게요", "먼저 ~, 그다음 ~", "~하면 깔끔해져요"처럼 순서를 짚어 가며 설명합니다. 들뜨지 않고, 학생이 따라오기 쉽게 한 걸음씩 말합니다.',
  c: '\n\n[말투] 예의는 지키되 에두르지 않는 심사위원처럼 말합니다. 짧게 끊는 해요체로, "솔직히 말씀드릴게요", "그게 정말 ~일까요?", "~는 좀 위험해요" 같은 말을 씁니다. 감탄이나 칭찬은 하지 않고, 핵심만 또박또박 짚습니다.'
};
const EXPERTS = [
  {key:'a', letter:'A', name:'아이디어 전문가', role:'각도 넓히기',

// ② 주제 좁히기 단계: 세 명 모두 범위를 줄이는 쪽으로만 말합니다
const NARROW = {

  b:'당신은 보고서 설계자입니다. 지금은 ② 주제 좁히기 단계입니다. 아이디어 전문가(A)가 좁힌 각도 중 하나를 골라, 그 좁은 범위 안에서 1장 서론 / 2장 정책·동향 / 3장 데이터 분석 / 4장 결론을 나누는 법을 제안합니다. 비교축은 시기·기업·지역·정책 전후 중 하나만 고르되, 범위를 더 줄여 주는 쪽을 고릅니다. 범위를 넓히는 제안은 하지 않으며 A가 한 말을 되풀이하지 않습니다.',
  c:'당신은 까다로운 심사자입니다. 지금은 ② 주제 좁히기 단계입니다. A와 B의 발언을 읽고 반대 의견을 반드시 2개 냅니다. 지적은 "너무 넓다", "뻔하다", "이미 많이 다뤄졌다", "10주에 못 끝낸다" 중 서로 다른 두 가지를 골라, 지적마다 한 문장씩 써서 무엇이 문제인지 분명히 드러냅니다. 두 지적은 서로 다른 약점을 겨눠야 합니다. 그다음 "대신 이렇게 좁혀 보세요"라는 말로 시작하는, 지금보다 범위가 더 작은 구체적인 대안을 딱 1개만 냅니다. 새 주제로 넓히지 않습니다. A·B가 이미 한 말이나 지난 회의에서 당신이 한 지적은 반복하지 않습니다.'

// 주제가 생소할 때만 최근 3~5년 흐름을 가볍게 훑습니다
const briefed = [];
async function trendBrief(){
  const prompt = '대학생이 보고서 주제를 찾고 있습니다. 학생이 지금까지 적은 생각:\n' + ideas.map((t,j) => (j+1) + '. ' + t).join('\n')
    + (briefed.length ? '\n\n이미 훑어 준 흐름(같은 주제면 다시 하지 않음):\n' + briefed.join('\n---\n') : '')
    + '\n\n이 주제가 일반 대학생에게 생소한 분야(전문 용어, 낯선 산업·제도 등)인지 판단하세요. 생소하고 아직 훑어 준 적이 없을 때만, 최근 3~5년의 큰 흐름을 한국어 존댓말 5줄 이내로 가볍게 정리합니다. 한 줄은 한 문장이고, 깊이 파고들지 않으며, 확실하지 않은 연도나 수치는 지어내지 않습니다. "자료를 찾아보세요" 같은 말은 쓰지 않습니다.\n'
    + '다음 JSON 하나로만 답하세요: {"unfamiliar":true|false,"lines":["…"]}';
  try{
    const r = await sample.json(prompt, {cache:false, modelTier:'quick'});
    if (r && r.unfamiliar === true && Array.isArray(r.lines) && r.lines.length){
      const lines = r.lines.map(String).filter(Boolean).slice(0,5);
      briefed.push(lines.join('\n'));
      return lines;
    }
  }catch(_){}
  return null;
}

// 역할별 아이콘: A 전구, B 보고서 페이지, C 안경, D 학사모, 흐름 훑기 추세선
const ICONS = {
  a:'<path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.7.6 1.1 1.3 1.1 2.1v.1h5v-.1c0-.8.4-1.5 1.1-2.1A6 6 0 0 0 12 3z"/>',
  b:'<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 9h2M9 13h6M9 17h6"/>',
  c:'<circle cx="6.5" cy="14" r="3.5"/><circle cx="17.5" cy="14" r="3.5"/><path d="M10 13.4c1.3-.9 2.7-.9 4 0M3 14l1.6-5.5M21 14l-1.6-5.5"/>',
  d:'<path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c0 1.6 2.7 3 6 3s6-1.4 6-3v-5M22 9v6"/>',

};
function badgeEl(key, letter){
  const b = document.createElement('div');
  b.className = 'badge';
  b.setAttribute('aria-hidden', 'true');
  b.innerHTML = '<svg viewBox="0 0 24 24">' + ICONS[key] + '</svg>' + (letter ? '<span class="badge-letter">' + letter + '</span>' : '');
  return b;
}

function card(ex){
  const d = document.createElement('div');
  d.className = 'expert ' + ex.key;
  d.innerHTML = '<div class="badge"></div><div class="who"></div><div class="say wait">차례를 기다리고 있습니다…</div>';
  d.querySelector('.badge').replaceWith(badgeEl(ex.key, ex.letter));
  d.querySelector('.who').innerHTML = '';
  d.querySelector('.who').append(ex.name);
  const s = document.createElement('span'); s.textContent = ex.role; d.querySelector('.who').append(s);
  return d;
}
const fiveLines = t => t.split('\n').map(l => l.trim()).filter(Boolean).slice(0,5).join('\n');

async function meeting(text, opts = {}){
  const from = opts.from || null;   // 다시 분석할 회의
  await ready;
  if (!sample) return;
  document.getElementById('roomEmpty').hidden = true;
  roundsEl.hidden = false;
  const round = document.createElement('div'); round.className = 'round';
  const head = document.createElement('div'); head.className = 'round-head';
  const st = stage;
  head.textContent = '회의 ' + (history.length + 1) + ' · ' + (from ? '다시 분석 (회의 ' + (history.indexOf(from) + 1) + ')' : (st === 2 ? '② 주제 좁히기' : '① 생각 넓히기')) + ' · "' + text.replace(/\s+/g,' ').slice(0,30) + (text.length > 30 ? '…' : '') + '"';
  round.appendChild(head);
  const cards = EXPERTS.map(ex => { const c = card(st === 2 && ex.key === 'a' ? {...ex, role:'범위 좁히기'} : ex); round.appendChild(c); return c; });
  roundsEl.appendChild(round);
  round.scrollIntoView({block:'start', behavior:'smooth'});

  // 생소한 주제일 때만 흐름 훑기 카드를 A 앞에 넣습니다
  const trend = from ? null : await trendBrief();
  let trendNote = '';
  if (trend){
    const b = el('div', 'expert brief');
    const who = el('div', 'who', '흐름 훑기'); who.append(el('span', null, '최근 3~5년'));
    b.append(badgeEl('trend'), who, el('div', 'say', trend.join('\n')));
    round.insertBefore(b, cards[0]);
    trendNote = '\n\n[방금 훑어 준 최근 흐름 — 되풀이하지 말 것]\n' + trend.join('\n');
  }

  const said = {};
  const past = history.length
    ? '\n\n[지난 회의 발언 — 반복 금지]\n' + history.map((h,i) => '회의 ' + (i+1) + '\nA: ' + h.a + '\nB: ' + h.b + '\nC: ' + h.c + (h.verdict && h.d ? '\n학생의 결정: "' + h.d.topic + '"를 ' + (h.verdict.yes ? '채택' : '거부') + ' (이유: ' + h.verdict.reason + ')' : '')).join('\n')
    : '';
  for (let i = 0; i < EXPERTS.length; i++){
    const ex = EXPERTS[i], say = cards[i].querySelector('.say');
    say.textContent = '생각하고 있습니다…';
    let prompt = (st === 2 ? NARROW[ex.key] : ex.brief) + VOICE[ex.key] + COMMON + '\n\n[학생이 지금까지 적은 생각]\n' + ideas.map((t,j) => (j+1) + '. ' + t).join('\n') + past + trendNote;
    if (from) prompt += RETHINK(from, ex.key);
    if (said.a) prompt += '\n\n[이번 회의 A의 발언]\n' + said.a;
    if (said.b) prompt += '\n\n[이번 회의 B의 발언]\n' + said.b;
    prompt += '\n\n이제 ' + ex.name + '(' + ex.letter + ')로서 발언만 쓰세요.';
    try{
      const r = await sample(prompt, {cache:false, onText: ({text}) => { say.className = 'say'; say.textContent = text; }});
      said[ex.key] = fiveLines(r.text);
      say.className = 'say'; say.textContent = said[ex.key];
    }catch(e){
      say.className = 'say wait';
      say.textContent = e && e.code === 'rate_limited' ? '요청이 잠시 많아 이번 차례는 건너뜁니다.' : '이번 차례에는 발언을 받지 못했습니다.';
      said[ex.key] = '(발언 없음)';
    }
  }
  const entry = {text, stage: st, trend, a:said.a, b:said.b, c:said.c, d:null, verdict:null, similar:false, rethinkOf: from ? history.indexOf(from) + 1 : null};
  history.push(entry);
  entry.similar = await converging(said);
  let band = null;
  if (entry.similar){
    band = el('div', 'warn');
    band.append(el('span', null, '셋이 같은 지점에서 확신하고 있습니다. 더 의심하십시오'));
    round.append(band);
  }
  await advisor(round, text, said, entry);

  // 다시 분석하기: 경고가 뜨면 띠 안에, 아니어도 회의 끝에 작게 둡니다
  const again = el('button', 'rethink', entry.similar ? '다시 분석하기' : '비슷한 얘기로 들리면 다시 분석하기');
  again.type = 'button';
  again.onclick = async () => {
    if (sendBtn.disabled) return;
    again.disabled = true; again.textContent = '다시 분석하고 있습니다…';
    sendBtn.disabled = true;
    await meeting(entry.text, {from: entry});
    again.textContent = '다시 분석했습니다';
    sendBtn.disabled = false;
  };
  if (band) band.append(again); else round.append(again);
}

// 다시 분석할 때 각자에게 주는 지시
function RETHINK(from, key){
  const role = {
    a: 'A는 직전에 나오지 않은 반대쪽이나 옆쪽 각도를 냅니다.',
    b: 'B는 직전과 다른 비교축을 고르고, 장 구성도 그 축에 맞게 다시 짭니다.',
    c: 'C는 세 사람이 함께 당연하게 여긴 전제 자체를 반박합니다.'
  }[key];
  return '\n\n[다시 분석 요청] 직전 회의에서 A·B·C가 같은 지점으로 모였습니다.\nA: ' + from.a + '\nB: ' + from.b + '\nC: ' + from.c
    + '\n이번에는 그 결론을 그대로 잇지 마세요. 무엇을 당연하게 여겼는지 의심하고, 직전과 분명히 다른 방향을 내세요. ' + role;
}

/* ---------- D 지도교수 ---------- */
function el(tag, cls, text){ const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

async function advisor(round, text, said, entry){
  const d = el('div', 'expert d');
  const badge = badgeEl('d', 'D');
  const who = el('div', 'who', '지도교수'); who.append(el('span', null, '종합'));
  const say = el('div', 'say wait', '세 분의 말을 종합하고 있습니다…');
  d.append(badge, who, say);
  round.appendChild(d);

  const decided = history.filter(h => h.verdict).map(h => '- ' + (h.verdict.yes ? '채택' : '거부') + ': "' + h.d.topic + '" (이유: ' + h.verdict.reason + ')').join('\n');
  const prompt = '당신은 학생의 지도교수입니다. 아래 세 전문가의 말을 종합해 답합니다. 한국어 존댓말로 씁니다.\n'
    + '"먼저 자료를 찾아보세요", "수치를 확인해 보세요" 같은 말은 쓰지 않습니다. 자료 수집은 다음 주에 합니다.\n\n'
    + '[학생이 이번에 적은 생각]\n' + text + '\n\n'
    + '[A 아이디어 전문가]\n' + said.a + '\n\n[B 보고서 설계자]\n' + said.b + '\n\n[C 까다로운 심사자]\n' + said.c
    + (decided ? '\n\n[학생이 이전에 내린 결정 — 존중할 것]\n' + decided : '')
    + (entry.similar ? '\n\n[주의] 세 사람의 결론이 비슷합니다. 그 공통 결론을 그대로 받아들이지 말고, "지금 정해야 할 것"에 그 결론을 의심해 볼 지점을 담으세요.' : '')
    + '\n\n다음 JSON 하나로만 답하세요. 다른 글은 쓰지 마세요.\n'
    + '{"topic":"주제 후보 한 문장","reasons":[{"who":"A|B|C 중 하나","text":"그 사람의 말에서 온 근거를 개조식 한 줄로"}],"command":"학생이 왼쪽 대화창에 그대로 복사해 붙여 넣을 다음 명령 한 줄","decide":"학생이 지금 정해야 할 것 한 가지, 한 문장"}\n'
    + 'reasons는 2~3개이며, C의 비판에서 온 근거를 반드시 1개 이상 넣습니다. reasons의 text는 개조식으로 씁니다. 존댓말 문장이 아니라 "~함", "~임", "~ 필요", "~ 우려"처럼 명사형으로 짧게 끝냅니다(예: "10주 안에 기업 3곳 비교는 과함"). topic, command, decide는 존댓말 문장으로 씁니다. command는 학생의 1인칭 존댓말 요청문으로 씁니다(예: "~해 주세요").';
  let r;
  try{
    r = await sample.json(prompt, {cache:false});
    if (!r || !r.topic) throw new Error('bad');
  }catch(e){
    say.textContent = e && e.code === 'rate_limited' ? '요청이 잠시 많아 종합을 건너뜁니다.' : '이번에는 종합을 받지 못했습니다.';
    return;
  }
  const reasons = (Array.isArray(r.reasons) ? r.reasons : []).slice(0,3);
  entry.d = {topic: String(r.topic), reasons, command: String(r.command || ''), decide: String(r.decide || '')};
  say.remove();

  const ol = el('ol', 'sum');
  const item = (n, lbl, body) => { const li = el('li'); li.append(el('span', 'n', n)); const b = el('div', 'body'); b.append(el('span', 'lbl', lbl)); if (typeof body === 'string') b.append(body); else b.append(body); li.append(b); ol.append(li); };
  item('1', '주제 후보', String(r.topic));
  const why = el('ul', 'why');
  reasons.forEach(x => { const w = String(x.who || '').trim().toUpperCase().charAt(0); const li = el('li'); const k = ['A','B','C'].includes(w) ? w : '?'; li.append(el('span', 'tag ' + k.toLowerCase(), k), String(x.text || '')); why.append(li); });
  item('2', '근거', why);
  const cmd = el('div', 'cmd'); const code = el('code', null, String(r.command || ''));
  const copy = el('button', 'small', '복사'); copy.type = 'button';
  copy.onclick = () => {
    const done = () => { copy.textContent = '복사됨'; setTimeout(() => copy.textContent = '복사', 1500); };
    const fallback = () => { const s = getSelection(), rg = document.createRange(); rg.selectNodeContents(code); s.removeAllRanges(); s.addRange(rg); copy.textContent = '선택됨 · Ctrl+C'; };
    try{ navigator.clipboard.writeText(code.textContent).then(done, fallback); }catch(_){ fallback(); }
  };
  const put = el('button', 'small', '입력창에 넣기'); put.type = 'button';
  put.onclick = () => { input.value = code.textContent; input.focus(); };
  cmd.append(code, copy, put);
  item('3', '다음에 칠 명령', cmd);
  item('4', '지금 정해야 할 것', String(r.decide || ''));
  d.append(ol);

  // 채택 / 거부
  const box = el('div', 'decide');
  const choice = el('div', 'choice');
  const yes = el('button', 'yes', '채택한다'), no = el('button', 'no', '거부한다');
  [yes, no].forEach(b => { b.type = 'button'; b.setAttribute('aria-pressed', 'false'); });
  choice.append(yes, no);
  const reasonRow = el('div', 'reason');
  const n = round.parentNode.children.length;
  const field = el('input'); field.type = 'text'; field.id = 'reason-' + n; field.placeholder = '이유를 한 줄로 적어 주세요'; field.setAttribute('aria-label', '이유');
  const save = el('button', null, '저장'); save.type = 'button'; save.disabled = true;
  reasonRow.append(field, save);
  const hint = el('div', 'hint', '채택 또는 거부를 고르고, 이유를 다섯 글자 이상 적으면 저장할 수 있습니다.');
  box.append(choice, reasonRow, hint);
  d.append(box);

  let pick = null;
  const len = s => [...s.replace(/\s/g, '')].length;
  const check = () => {
    const ok = pick !== null && len(field.value) >= 5;
    save.disabled = !ok;
    hint.textContent = pick === null ? '채택 또는 거부를 먼저 골라 주세요.'
      : (len(field.value) < 5 ? '이유를 다섯 글자 이상 적어 주세요. (지금 ' + len(field.value) + '자)' : '저장할 수 있습니다.');
  };
  const choose = v => { pick = v; yes.setAttribute('aria-pressed', String(v === true)); no.setAttribute('aria-pressed', String(v === false)); check(); field.focus(); };
  yes.onclick = () => choose(true);
  no.onclick = () => choose(false);
  field.addEventListener('input', check);
  field.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing && !save.disabled){ e.preventDefault(); save.click(); } });
  save.onclick = () => {
    entry.verdict = {yes: pick, reason: field.value.trim()};
    box.replaceChildren();
    const s = el('div', 'saved');
    s.append(el('b', pick ? 'yes' : 'no', pick ? '채택했습니다' : '거부했습니다'), ' · 이유: ' + entry.verdict.reason);
    box.append(s);
    const why = entry.verdict.reason.replace(/[.。\s]+$/, '');
    input.value = pick
      ? '"' + r.topic + '" 주제를 채택하겠습니다. 이유는 ' + why + '입니다. ' + (r.command || '이 주제로 이어서 논의해 주세요.')
      : '"' + r.topic + '" 주제는 거부하겠습니다. 이유는 ' + why + '입니다. 이 이유를 전제로 다시 논의해 주세요.';
    input.focus();
    input.setSelectionRange(input.value.length, input.value.length);
    input.scrollIntoView({block:'nearest', behavior:'smooth'});
  };
  check();
}

/* ---------- 꼭 필요할 때만 객관식으로 되묻기 ---------- */
let lastAsk = null;      // 바로 앞에서 던진 질문
const OTHER = '그 외 — 직접 입력하기';

// 짧은 단어나 주제명만 들어왔는지
const isShort = t => t.trim().split(/\s+/).length <= 2 || t.replace(/\s/g, '').length <= 10;

async function gate(text){
  if (lastAsk) return null;                    // 질문에 대한 답이면 연달아 묻지 않습니다
  await ready;
  if (!sample) return null;
  const short = isShort(text);
  const prompt = '대학생이 10주짜리 보고서 주제를 찾고 있습니다.\n'
    + (ideas.length > 1 ? '[앞서 적은 생각]\n' + ideas.slice(0, -1).map((t,j) => (j+1) + '. ' + t).join('\n') + '\n\n' : '')
    + '[방금 적은 말]\n' + text + '\n\n'
    + '방금 적은 말을 중심으로 세 가지가 분명한지 판단하세요. 방금 말이 새 주제라면 앞의 생각으로 채워 넣지 마세요.\n- target(대상): 무엇·누구를 다루는지(산업, 기업, 집단, 지역, 정책 등)\n- period(기간): 어느 시기를 보는지\n- interest(관심사): 그 대상에서 무엇이 궁금한지\n'
    + '그리고 한국어 존댓말로 다음을 만드세요.\n- related: 방금 말에서 이어지는 관련 질문 2개. 학생이 생각을 넓히도록 되묻는 짧은 질문입니다(예: "~은 어떻게 달라졌을까요?").\n- question: 분명하지 않은 것 중 가장 중요한 하나를 묻는 짧은 객관식 질문 하나.\n- options: question에 대한 서로 다른 구체적인 보기 2개(짧은 구절).\n'
    + '다음 JSON 하나로만 답하세요: {"target":true|false,"period":true|false,"interest":true|false,"related":["…","…"],"question":"…","options":["…","…"]}';
  const fallback = {
    related: [],
    question: '"' + text.trim() + '"에서 어떤 점이 가장 궁금하신가요?',
    options: ['최근 몇 년 사이의 변화', '문제가 생긴 원인과 영향', OTHER]
  };
  try{
    const r = await sample.json(prompt, {cache:false, modelTier:'quick'});
    const clear = [r.target, r.period, r.interest].filter(v => v === true).length;
    if (!short && clear >= 2) return null;     // 두 가지가 분명하면 바로 진행합니다
    const opts = (Array.isArray(r.options) ? r.options : []).map(String).filter(Boolean).slice(0,2);
    const related = (Array.isArray(r.related) ? r.related : []).map(String).filter(Boolean).slice(0,2);
    if (!r.question || opts.length < 2) return short ? {...fallback, related} : null;
    return {question: String(r.question), related, options: [...opts, OTHER]};
  }catch(_){
    return short ? fallback : null;            // 짧은 단어면 판단이 실패해도 되묻습니다
  }
}

function askBubble(ask){
  const d = add('ai', '');
  if (ask.related && ask.related.length){
    const intro = el('div', 'related-intro', '이런 방향도 생각해 볼 수 있습니다.');
    const ul = el('ul', 'related');
    ask.related.forEach(q => ul.append(el('li', null, q)));
    d.append(intro, ul);
  }
  d.append(el('div', 'ask-q', ask.question));
  const box = el('div', 'opts');
  ask.options.forEach(o => {
    const b = el('button', 'opt' + (o === OTHER ? ' other' : ''), o); b.type = 'button';
    b.onclick = () => {
      if (sendBtn.disabled) return;
      if (o === OTHER){ input.value = ''; input.placeholder = '직접 적어 주세요'; input.focus(); return; }
      input.value = o; form.requestSubmit();
    };
    box.append(b);
  });
  d.append(box);
  log.scrollTop = log.scrollHeight;
  ask.el = box;
}

form.addEventListener('submit', async e => {
  e.preventDefault();
  const t = input.value.trim();
  if (!t || sendBtn.disabled) return;
  input.value = ''; input.placeholder = '생각나는 것을 자유롭게 적어 주세요';
  sendBtn.disabled = true;
  if (lastAsk){ lastAsk.el.querySelectorAll('button').forEach(b => b.disabled = true); }
  add('me', t);
  turns.push({role:'user', content: t});
  ideas.push(lastAsk ? '(질문 "' + lastAsk.question + '"에 대한 답) ' + t : t);

  const bubble = add('ai wait', '생각하고 있습니다…');
  const exec = isExec(t);
  if (stage === 3 || (exec && wantsToc(t))){
    // 토론 없이 제목·목차를 바로 만듭니다
    lastAsk = null;
    const only = stage === 3 ? null : t;
    const ok = await titleToc(t, {titles: !only || /제목/.test(t) || !/(목차|구성|개요)/.test(t), toc: !only || /(목차|구성|개요)/.test(t)});
    bubble.className = 'msg ai';
    bubble.textContent = ok ? '회의실에 바로 정리했습니다. 고치고 싶은 부분을 말씀해 주세요.' : '이번에는 만들지 못했습니다. 다시 보내 주세요.';
    if (ok) turns.push({role:'assistant', content: bubble.textContent});
    else turns.pop();
    sendBtn.disabled = false; input.focus();
    return;
  }
  if (exec){
    // 실행 요청은 토론을 열지 않고 왼쪽에서 바로 답합니다
    lastAsk = null;
    await send(bubble, 'exec');
    sendBtn.disabled = false; input.focus();
    return;
  }
  const ask = await gate(t);
  lastAsk = null;
  if (ask){
    bubble.remove();
    askBubble(ask);
    turns.push({role:'assistant', content: (ask.related && ask.related.length ? ask.related.join(' ') + ' ' : '') + ask.question + ' (보기: ' + ask.options.join(' / ') + ')'});
    lastAsk = ask;
  } else {
    await Promise.all([send(bubble, stage), meeting(t)]);
  }
  sendBtn.disabled = false; input.focus();
});

/* ---------- ③ 제목과 목차 ---------- */
async function titleToc(request, want){
  await ready;
  if (!sample) return false;
  document.getElementById('roomEmpty').hidden = true;
  roundsEl.hidden = false;
  const round = el('div', 'round');
  round.append(el('div', 'round-head', '제목과 목차 · 토론 없이 바로'));
  const d = el('div', 'expert d');
  const who = el('div', 'who', '지도교수'); who.append(el('span', null, want.titles && want.toc ? '제목 후보와 목차' : (want.toc ? '목차' : '제목 후보')));
  const say = el('div', 'say wait', '만들고 있습니다…');
  d.append(badgeEl('d', 'D'), who, say);
  round.append(d);
  roundsEl.append(round);
  round.scrollIntoView({block:'start', behavior:'smooth'});

  const decisions = history.filter(h => h.verdict && h.d).map(h => '- ' + (h.verdict.yes ? '채택' : '거부') + ': "' + h.d.topic + '" (이유: ' + h.verdict.reason + ')').join('\n');
  const lastTopic = [...history].reverse().find(h => h.d && !(h.verdict && !h.verdict.yes));
  const prompt = '당신은 대학생의 지도교수입니다. 토론 없이 바로 결과만 만듭니다. 한국어로 씁니다.\n\n'
    + '[학생이 지금까지 적은 생각]\n' + ideas.map((t,j) => (j+1) + '. ' + t).join('\n')
    + (decisions ? '\n\n[학생의 결정 — 채택한 주제를 따르고 거부한 주제는 쓰지 말 것]\n' + decisions : '')
    + (lastTopic ? '\n\n[가장 최근 주제 후보]\n' + lastTopic.d.topic : '')
    + (request ? '\n\n[학생의 요청]\n' + request : '')
    + '\n\n보고서 제목 후보 3개와 4장 목차를 만드세요. 목차의 장은 반드시 1장 서론 / 2장 정책·동향 / 3장 데이터 분석 / 4장 결론 순서이며, 각 장에 이 주제에 맞춘 장 제목과 절 2~3개를 붙입니다. 제목 후보는 서로 다른 느낌(정직한 제목, 질문형, 부제가 있는 제목)으로 씁니다. 10주 안에 끝낼 수 있는 범위로 씁니다.\n'
    + '다음 JSON 하나로만 답하세요: {"titles":["…","…","…"],"chapters":[{"title":"1장 서론: …","sections":["1.1 …","1.2 …"]},{"title":"2장 정책·동향: …","sections":[]},{"title":"3장 데이터 분석: …","sections":[]},{"title":"4장 결론: …","sections":[]}]}';
  let r;
  try{
    r = await sample.json(prompt, {cache:false});
    if (!r || !Array.isArray(r.titles) || !Array.isArray(r.chapters)) throw new Error('bad');
  }catch(e){
    say.textContent = e && e.code === 'rate_limited' ? '요청이 잠시 많습니다. 조금 뒤에 다시 보내 주세요.' : '이번에는 만들지 못했습니다.';
    return false;
  }
  say.remove();
  const box = el('div', 'toc');
  const plain = [], tocPlain = [];
  if (want.titles){
    box.append(el('h4', null, '제목 후보'));
    const ol = el('ol');
    r.titles.slice(0,3).forEach(t => ol.append(el('li', null, String(t))));
    box.append(ol);
    plain.push('[제목 후보]', ...r.titles.slice(0,3).map((t,i) => (i+1) + '. ' + t));
  }
  if (want.toc){
    box.append(el('h4', null, '목차'));
    const wrap = el('div');
    r.chapters.slice(0,4).forEach(c => {
      wrap.append(el('div', 'ch', String(c.title || '')));
      const ul = el('ul');
      (Array.isArray(c.sections) ? c.sections : []).slice(0,3).forEach(s => ul.append(el('li', null, String(s))));
      wrap.append(ul);
      tocPlain.push(String(c.title || ''), ...(Array.isArray(c.sections) ? c.sections : []).slice(0,3).map(s => '  ' + s));
    });
    box.append(wrap);
    if (plain.length) plain.push('');
    plain.push('[목차]', ...tocPlain);
  }
  const copy = el('button', 'small', '전체 복사'); copy.type = 'button';
  copy.onclick = () => {
    const txt = plain.join('\n');
    try{ navigator.clipboard.writeText(txt).then(() => { copy.textContent = '복사됨'; setTimeout(() => copy.textContent = '전체 복사', 1500); }, () => { copy.textContent = '복사하지 못했습니다'; }); }
    catch(_){ copy.textContent = '복사하지 못했습니다'; }
  };
  const row = el('div', 'cmd'); row.append(copy);
  box.append(row);
  d.append(box);
  tocs.push({request, titles: want.titles ? r.titles.slice(0,3).map(String) : [], chapters: want.toc ? r.chapters.slice(0,4) : []});
  return true;
}

/* ---------- 세 명의 결론이 비슷한지 ---------- */
async function converging(said){
  if (!said.a || !said.b || !said.c || [said.a, said.b, said.c].includes('(발언 없음)')) return false;
  const prompt = '아래는 보고서 주제 회의에서 세 사람이 한 발언입니다.\n\n[A]\n' + said.a + '\n\n[B]\n' + said.b + '\n\n[C]\n' + said.c
    + '\n\nC가 형식상 반대 의견을 냈더라도, 세 사람이 결국 같은 주제·같은 범위·같은 방향을 결론으로 밀고 있는지 판단하세요. 실질적으로 다른 방향을 제시한 사람이 있으면 false입니다.\n'
    + '다음 JSON 하나로만 답하세요: {"similar":true|false}';
  try{ const r = await sample.json(prompt, {cache:false, modelTier:'quick'}); return r && r.similar === true; }
  catch(_){ return false; }
}

/* ---------- 기록 내려받기 ---------- */
const tocs = [];
function buildRecord(){
  const now = new Date();
  const pad = n => String(n).padStart(2, '0');
  const stamp = now.getFullYear() + '-' + pad(now.getMonth()+1) + '-' + pad(now.getDate()) + ' ' + pad(now.getHours()) + ':' + pad(now.getMinutes());
  const L = ['# 내 보고서 연구실 기록', '', '내려받은 때: ' + stamp, ''];

  const finalToc = [...tocs].reverse().find(t => t.chapters.length);
  const finalTitles = [...tocs].reverse().find(t => t.titles.length);
  const adopted = history.filter(h => h.verdict && h.verdict.yes && h.d);
  L.push('## 정한 내용', '');
  L.push('- 채택한 주제: ' + (adopted.length ? adopted[adopted.length-1].d.topic : '아직 없습니다'));
  if (finalTitles){ L.push('', '### 제목 후보'); finalTitles.titles.forEach((t,i) => L.push((i+1) + '. ' + t)); }
  else L.push('- 제목 후보: 아직 없습니다');
  if (finalToc){
    L.push('', '### 목차');
    finalToc.chapters.forEach(c => { L.push('- ' + (c.title || '')); (Array.isArray(c.sections) ? c.sections : []).slice(0,3).forEach(s => L.push('  - ' + s)); });
  } else L.push('- 목차: 아직 없습니다');
  L.push('');

  L.push('## 내 판단', '');
  const verdicts = history.filter(h => h.verdict && h.d);
  if (verdicts.length) verdicts.forEach(h => L.push('- ' + (h.verdict.yes ? '채택' : '거부') + ': "' + h.d.topic + '" — 이유: ' + h.verdict.reason));
  else L.push('- 아직 채택하거나 거부한 주제가 없습니다.');
  L.push('');

  L.push('## 회의실 토론', '');
  if (!history.length) L.push('아직 열린 회의가 없습니다.', '');
  history.forEach((h,i) => {
    L.push('### 회의 ' + (i+1) + ' · ' + (h.rethinkOf ? '다시 분석 (회의 ' + h.rethinkOf + ')' : (h.stage === 2 ? '② 주제 좁히기' : '① 생각 넓히기')), '', '> ' + h.text.replace(/\n/g, '\n> '), '');
    if (h.trend) L.push('**흐름 훑기 (최근 3~5년)**', ...h.trend.map(x => '- ' + x), '');
    L.push('**A 아이디어 전문가**', h.a || '', '', '**B 보고서 설계자**', h.b || '', '', '**C 까다로운 심사자**', h.c || '', '');
    if (h.similar) L.push('⚠ 셋이 같은 지점에서 확신하고 있습니다. 더 의심하십시오', '');
    if (h.d){
      L.push('**D 지도교수**', '1) 주제 후보: ' + h.d.topic, '2) 근거:');
      h.d.reasons.forEach(x => L.push('   - [' + String(x.who || '?').trim().charAt(0).toUpperCase() + '] ' + (x.text || '')));
      L.push('3) 다음에 칠 명령: ' + h.d.command, '4) 지금 정해야 할 것: ' + h.d.decide);
      L.push('→ 내 판단: ' + (h.verdict ? (h.verdict.yes ? '채택' : '거부') + ' (이유: ' + h.verdict.reason + ')' : '아직 정하지 않았습니다'), '');
    }
  });

  if (tocs.length > 1){
    L.push('## 지난 제목·목차 안', '');
    tocs.slice(0, -1).forEach((t,i) => {
      L.push('### ' + (i+1) + '번째 안' + (t.request ? ' — 요청: ' + t.request : ''));
      t.titles.forEach((x,j) => L.push((j+1) + '. ' + x));
      t.chapters.forEach(c => L.push('- ' + (c.title || '')));
      L.push('');
    });
  }

  L.push('## AI와 나눈 대화', '');
  turns.forEach(t => L.push((t.role === 'user' ? '**나**: ' : '**AI**: ') + t.content, ''));
  return L.join('\n');
}

      sendBtn.disabled = true;
      const ok = await titleToc(null, {titles:true, toc:true});
      note.textContent = ok ? STAGE_NOTE[3] + '\n회의실에 정리했습니다. 고치고 싶은 부분을 말씀해 주세요.' : STAGE_NOTE[3] + '\n이번에는 만들지 못했습니다. 아무 말이나 보내 주시면 다시 만듭니다.';
      sendBtn.disabled = false;
    } else if (n === 3 && !ideas.length){
      note.textContent = STAGE_NOTE[3] + '\n먼저 다루고 싶은 주제를 한 줄 적어 주세요.';
    }
  });
});
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing){ e.preventDefault(); form.requestSubmit(); }
});
</script>
